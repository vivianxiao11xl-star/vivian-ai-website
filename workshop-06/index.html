<!DOCTYPE html>
<html class="staticrypt-html">
<head>
<meta charset="utf-8">
<title>一号位 AI 工作坊</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<style>
  :root {
    --bg-0: #050a13;
    --bg-1: #0a0f1a;
    --bg-2: #111a2a;
    --brand-blue: #0071e3;
    --brand-blue-soft: #2997ff;
    --brand-gold: #FFC857;
    --text-primary: #ffffff;
    --text-muted: rgba(255,255,255,0.78);
    --text-subtle: rgba(255,255,255,0.55);
    --text-dim: rgba(255,255,255,0.38);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body.staticrypt-body { height: 100%; }
  body.staticrypt-body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    color: var(--text-muted);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #0a0f1a;
    background-image:
      radial-gradient(900px 500px at 50% -150px, rgba(41,151,255,0.18), transparent 60%),
      radial-gradient(600px 300px at 85% 50%, rgba(255,200,87,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
    min-height: 100vh;
  }

  .staticrypt-content {
    background: transparent;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    font-family: inherit;
  }
  .staticrypt-content.hidden { display: none !important; }

  .staticrypt-page {
    width: 100%;
    max-width: 460px;
    position: relative;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--brand-gold);
    text-transform: uppercase;
    padding: 7px 20px;
    border: 1px solid rgba(255,200,87,0.3);
    border-radius: 24px;
    background: rgba(255,200,87,0.04);
    margin-bottom: 32px;
  }
  .brand-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand-gold);
    box-shadow: 0 0 12px rgba(255,200,87,0.6);
  }

  .staticrypt-form {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 52px 44px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    max-width: 460px;
    margin: 0;
    position: static;
  }

  .staticrypt-instructions {
    margin-bottom: 36px;
    margin-top: 0;
  }
  .staticrypt-title {
    font-size: 22px !important;
    font-weight: 900;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    line-height: 1.35;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ffffff 30%, var(--brand-blue-soft) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .staticrypt-instructions p:not(.staticrypt-title) {
    font-size: 13.5px;
    color: var(--text-subtle);
    line-height: 1.65;
    letter-spacing: 0.5px;
  }
  .staticrypt-hr { display: none; }

  .staticrypt-password-container {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    margin: 0 0 16px;
    width: 100%;
    box-sizing: border-box;
    outline: 0;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .staticrypt-password-container:focus-within {
    border-color: var(--brand-blue-soft);
    background: rgba(41,151,255,0.06);
    box-shadow: 0 0 0 3px rgba(41,151,255,0.12);
  }
  .staticrypt-form input[type="password"],
  .staticrypt-form input[type="text"] {
    background: transparent !important;
    border: 0 !important;
    color: var(--text-primary) !important;
    font-family: inherit;
    font-size: 15px !important;
    padding: 16px 50px 16px 18px !important;
    width: 100%;
    outline: 0;
    text-align: center;
    letter-spacing: 2px;
  }
  .staticrypt-form input::placeholder {
    color: rgba(255,255,255,0.32);
    letter-spacing: 3px;
  }

  .staticrypt-toggle-password-visibility {
    cursor: pointer;
    height: 18px;
    width: 18px;
    opacity: 0.45;
    padding: 16px;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    filter: invert(1);
    transition: opacity 0.2s;
  }
  .staticrypt-toggle-password-visibility:hover { opacity: 0.75; }

  .staticrypt-form .staticrypt-decrypt-button {
    background: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-blue-soft) 100%) !important;
    text-transform: none !important;
    width: 100%;
    border: 0;
    padding: 16px 20px !important;
    color: #ffffff;
    font-size: 15px !important;
    font-weight: 700;
    letter-spacing: 6px;
    cursor: pointer;
    border-radius: 14px !important;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.15s;
    font-family: inherit;
  }
  .staticrypt-form .staticrypt-decrypt-button:hover,
  .staticrypt-form .staticrypt-decrypt-button:focus {
    filter: brightness(110%);
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(0,113,227,0.35);
  }
  .staticrypt-form .staticrypt-decrypt-button:active {
    transform: translateY(0);
  }

  label.staticrypt-remember {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0 0;
    color: var(--text-subtle);
    font-size: 13px;
  }
  .staticrypt-remember input[type="checkbox"] {
    transform: scale(1.15);
    margin-right: 10px;
    accent-color: var(--brand-blue-soft);
  }
  .footer-brand {
    margin-top: 36px;
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  .staticrypt-spinner-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .staticrypt-spinner {
    display: inline-block;
    width: 2.5rem;
    height: 2.5rem;
    border: 0.2em solid rgba(41,151,255,0.2);
    border-right-color: var(--brand-blue-soft);
    border-radius: 50%;
    animation: sc-spin 0.75s linear infinite;
  }
  @keyframes sc-spin { 100% { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .staticrypt-form { padding: 40px 28px; }
    .staticrypt-title { font-size: 19px !important; }
  }
</style>
</head>

  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
  const gateStatus = document.getElementById("gate-status");
  const submitButton = document.querySelector(".staticrypt-decrypt-button");
  const assetBase = new URL(".", location.href);

  // Reuse Staticrypt 3.5.4 authenticated codec through its public API. The
  // current page key stays in this closure when remember-me is unchecked.
  function enterWorkshop(key) {
    if (!pendingHTML) throw new Error("No authenticated page");
    window.workshopDecryptMedia = async function (relativeURL) {
      if (!key) throw new Error("Unlock required");
      if (!/^protected-media\/[a-f0-9]{32}\.bin$/.test(relativeURL)) throw new Error("Invalid media path");
      const url = new URL(relativeURL, assetBase);
      async function part(start, end) {
        for (let attempt=0;attempt<2;attempt++) {
          const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
          try {
            const response=await fetch(url.href,{headers:{Range:`bytes=${start}-${end}`},signal:controller.signal,credentials:"same-origin",cache:"no-store"});
            if (!response.ok) throw new Error("Image HTTP "+response.status);
            const data=new Uint8Array(await response.arrayBuffer());
            if (response.status===200 && start===0) return {data,total:data.length,whole:true};
            const match=/^bytes (\d+)-(\d+)\/(\d+)$/.exec(response.headers.get("content-range")||"");
            if(response.status!==206||!match||Number(match[1])!==start||data.length!==Number(match[2])-start+1||Number(match[2])!==Math.min(end,Number(match[3])-1))throw new Error("Incomplete image segment");
            return {data,total:Number(match[3]),whole:false};
          } catch(error) { if(attempt===1)throw error; }
          finally { clearTimeout(timer); }
        }
      }
      const chunkSize=32768,first=await part(0,chunkSize-1);
      if(first.total<=0||first.total>2097152)throw new Error("Invalid image size");
      const bytes=new Uint8Array(first.total);bytes.set(first.data,0);
      if(!first.whole) {
        let offset=first.data.length;
        async function worker(){while(offset<bytes.length){const start=offset;offset+=chunkSize;const next=await part(start,Math.min(start+chunkSize-1,bytes.length-1));if(next.total!==bytes.length)throw new Error("Image changed during loading");bytes.set(next.data,start);}}
        await Promise.all([worker(),worker()]);
      }
        const signedMessage = Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");
        let payload = null;
        const reader = staticryptInitiator.init({
          ...staticryptConfig,
          staticryptEncryptedMsgUniqueVariableName:signedMessage,
          isRememberEnabled:false,
        }, {...templateConfig,replaceHtmlCallback:value=>{payload=value;}});
        const result = await reader.handleDecryptionOfPageFromHash(key, false);
        if (!result.isSuccessful || !/^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(payload || "")) throw new Error("Image authentication failed");
        return payload;
    };
    const html = pendingHTML;
    document.open(); document.write(html); document.close();
  }

  function showGate(message) {
    gateStatus.textContent = message || "";
    submitButton.disabled = false;
    submitButton.value = "进入";
  }

  // Never wait for window.onload or remote fonts to reveal the password form.
  // Run after this script has bound the form; keep a usable error state.
  setTimeout(async () => {
    try {
      if (!window.crypto || !window.crypto.subtle) {
        gateStatus.textContent = "当前浏览器不支持安全解锁，请复制网址到 Safari 或 Chrome 打开。";
        return;
      }
      const result = await staticrypt.handleDecryptOnLoad();
      if (result.isSuccessful) {
        const fragment = new URLSearchParams(location.hash.slice(1));
        const key = fragment.get("staticrypt_pwd") || new URLSearchParams(location.search).get("staticrypt_pwd") || localStorage.getItem("staticrypt_passphrase");
        enterWorkshop(key);
      } else { showGate(); }
    } catch (_) { showGate("自动解锁未完成，请重新输入口令。"); }
  }, 0);

  const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
  const imgSrcEyeClosed = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48cGF0aCBkPSJNMzguOCA1LjFDMjguNC0zLjEgMTMuMy0xLjIgNS4xIDkuMlMtMS4yIDM0LjcgOS4yIDQyLjlsNTkyIDQ2NGMxMC40IDguMiAyNS41IDYuMyAzMy43LTQuMXM2LjMtMjUuNS00LjEtMzMuN0w1MjUuNiAzODYuN2MzOS42LTQwLjYgNjYuNC04Ni4xIDc5LjktMTE4LjRjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDY1LjUgNjguOCA0MDAuOCAzMiAzMjAgMzJjLTY4LjIgMC0xMjUgMjYuMy0xNjkuMyA2MC44TDM4LjggNS4xeiIvPjwvc3ZnPg==";
  const imgSrcEyeOpened = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48cGF0aCBkPSJNMjg4IDMyYy04MC44IDAtMTQ1LjUgMzYuOC0xOTIuNiA4MC42QzQ4LjYgMTU2IDE3LjMgMjA4IDIuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZDMTcuMyAzMDQgNDguNiAzNTYgOTUuNCAzOTkuNEMxNDIuNSA0NDMuMiAyMDcuMiA0ODAgMjg4IDQ4MHMxNDUuNS0zNi44IDE5Mi42LTgwLjZjNDYuOC00My41IDc4LjEtOTUuNCA5My0xMzEuMWMzLjMtNy45IDMuMy0xNi43IDAtMjQuNmMtMTQuOS0zNS43LTQ2LjItODcuNy05My0xMzEuMUM0MzMuNSA2OC44IDM2OC44IDMyIDI4OCAzMnptMTQ0IDIyNGExNDQgMTQ0IDAgMSAxIDI4OCAwIDE0NCAxNDQgMCAxIDEgLTI4OCAweiIvPjwvc3ZnPg==";

  toggleIcon.addEventListener("click", function () {
    const passwordInput = document.getElementById("staticrypt-password");
    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      toggleIcon.src = imgSrcEyeOpened;
      toggleIcon.alt = templateToggleAltHide;
      toggleIcon.title = templateToggleAltHide;
    } else {
      passwordInput.type = "password";
      toggleIcon.src = imgSrcEyeClosed;
      toggleIcon.alt = templateToggleAltShow;
      toggleIcon.title = templateToggleAltShow;
    }
  });

  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const password = document.getElementById("staticrypt-password").value;
    let remember = document.getElementById("staticrypt-remember").checked;
    if (remember) {
      try { localStorage.setItem("workshop_storage_probe","1");localStorage.removeItem("workshop_storage_probe"); }
      catch (_) { remember = false; }
    }
    submitButton.disabled = true; submitButton.value = "解锁中…";
    gateStatus.textContent = "正在安全解锁，请稍候…";
    try {
      const result = await staticrypt.handleDecryptionOfPage(password, remember);
      if (result.isSuccessful) enterWorkshop(result.hashedPassword);
      else { showGate("口令不正确，请检查大小写后重试。"); alert(templateError); }
    } catch (_) { showGate("解锁未完成，请重试；也可复制网址到系统浏览器打开。"); }
  });
</script>
