<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09111f">
<title>AI 经营参谋 · 现场投票</title>
<style>
:root{--bg:#09111f;--panel:#111d31;--panel2:#16243a;--fg:#f6f8fb;--muted:#9aa8bd;--line:rgba(255,255,255,.1);--blue:#3979ff;--orange:#f08a38;--gold:#d9ff55;--danger:#ff8c9c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(circle at 10% -5%,rgba(57,121,255,.2),transparent 33%),radial-gradient(circle at 94% 0,rgba(240,138,56,.16),transparent 28%),var(--bg)}
.wrap{width:min(100%,620px);min-height:100vh;margin:0 auto;padding:30px 19px 42px;display:flex;flex-direction:column}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:900;color:var(--gold);margin-bottom:11px}.brand{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:16px}h1{font-size:clamp(28px,8vw,42px);line-height:1.08;letter-spacing:-1px;margin:0 0 13px;font-weight:950}.lead{font-size:14px;line-height:1.75;color:#c3ccda;margin:0 0 18px}.rules{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:23px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:#c4ccd9;font-size:11px;font-weight:800;background:rgba(255,255,255,.035)}.question{margin:0 0 20px}.q-label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;letter-spacing:1.2px;font-weight:900;margin:0 0 9px}.q-label b{color:var(--gold);font-size:12px}.q-title{font-size:17px;line-height:1.45;font-weight:900;margin:0 0 11px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{appearance:none;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));color:var(--fg);border-radius:17px;padding:15px 13px;text-align:left;cursor:pointer;min-height:112px;transition:transform .15s,border-color .15s,background .15s}.option:active{transform:scale(.985)}.option.selected[data-team="A"]{border-color:var(--blue);background:rgba(57,121,255,.18)}.option.selected[data-team="B"]{border-color:var(--orange);background:rgba(240,138,56,.18)}.badge{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:950;color:#fff;margin-bottom:9px}.badge.A{background:linear-gradient(145deg,#4b8aff,#2450c9)}.badge.B{background:linear-gradient(145deg,#ffad5e,#cb5a16)}.option-title{display:block;font-size:15px;font-weight:900;margin-bottom:5px}.members{display:block;color:var(--muted);font-size:10px;line-height:1.45;font-weight:650}.submit{width:100%;border:0;border-radius:15px;background:var(--gold);color:#142000;font-size:16px;font-weight:950;padding:15px 14px;cursor:pointer;margin-top:2px;box-shadow:0 12px 34px rgba(217,255,85,.17)}.submit:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}.error{min-height:20px;text-align:center;color:var(--danger);font-size:12px;line-height:1.5;margin-top:11px}.done{display:none;margin-top:18px;padding:39px 20px 34px;text-align:center;border:1px solid rgba(217,255,85,.24);border-radius:24px;background:linear-gradient(145deg,rgba(217,255,85,.12),rgba(217,255,85,.025))}.done.active{display:block}.check{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#172000;font-size:37px;font-weight:950;margin:0 auto 17px}.done h2{margin:0 0 8px;font-size:26px}.done p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}.voted{margin-top:15px;color:var(--gold);font-size:15px;font-weight:900}.foot{margin-top:auto;padding-top:27px;color:#6c7a90;text-align:center;font-size:10px;letter-spacing:.5px}@media(max-width:390px){.wrap{padding-left:15px;padding-right:15px}.option{min-height:105px;padding:13px 11px}.option-title{font-size:14px}.members{font-size:9px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">COHORT 05 · LIVE VOTE</div>
  <div class="brand">一小时 AI 员工挑战赛｜AI 经营参谋</div>
  <h1>投出你认为<br>最值得试岗的 AI 员工</h1>
  <p class="lead">两组都发布完成后再投。下面两题各选一组，每题 1 票；结果会在现场公开亮票。</p>
  <div class="rules"><span class="chip">两题各一票</span><span class="chip">公开投票</span><span class="chip">不做复杂打分</span></div>

  <section class="question">
    <div class="q-label"><span>QUESTION 01</span><b>试岗价值 · 20 分</b></div>
    <h2 class="q-title">如果我是老板，下周最愿意先让哪一名 AI 员工试岗？</h2>
    <div class="options" data-question="trial">
      <button class="option" type="button" data-team="A"><span class="badge A">A</span><span class="option-title">A 蓝组</span><span class="members">杨墨 · 杜慕群 · Rainbow · 王倩 · 许欣慈 · Will</span></button>
      <button class="option" type="button" data-team="B"><span class="badge B">B 橙组</span><span class="option-title">B 橙组</span><span class="members">Eva · Sabrina · 邱蓓 · 李威（Max）· Cissy · 言书</span></button>
    </div>
  </section>

  <section class="question">
    <div class="q-label"><span>QUESTION 02</span><b>发布说服力 · 20 分</b></div>
    <h2 class="q-title">哪一组让我最相信它已经能上岗？</h2>
    <div class="options" data-question="convince">
      <button class="option" type="button" data-team="A"><span class="badge A">A</span><span class="option-title">A 蓝组</span><span class="members">AI 经营参谋发布方案</span></button>
      <button class="option" type="button" data-team="B"><span class="badge B">B</span><span class="option-title">B 橙组</span><span class="members">AI 经营参谋发布方案</span></button>
    </div>
  </section>

  <button class="submit" id="submit" type="button" disabled>请选择两题后提交</button>
  <div class="error" id="error" role="alert"></div>
  <section class="done" id="done" aria-live="polite"><div class="check">✓</div><h2>投票成功</h2><div class="voted" id="voted">已记录你的两票</div><p>本设备已完成投票。<br>请等待 Vivian 现场亮票。</p></section>
  <footer class="foot">一号位 AI 工作坊 · 深圳第五期 · 2026.09.13</footer>
</main>
<script>
const API='https://abacus.jasoncameron.dev';
const NS='vivian-ws-20260913-ai-manager-vote-v1';
const LS_KEY='vivian_ws_20260913_ai_manager_vote_v1';
const PREVIEW=new URLSearchParams(location.search).get('preview')==='1';
const choices={trial:null,convince:null};
const $=id=>document.getElementById(id);
const label=t=>t==='A'?'A 蓝组':'B 橙组';
document.querySelectorAll('.options').forEach(box=>box.addEventListener('click',e=>{const button=e.target.closest('.option');if(!button)return;const q=box.dataset.question;choices[q]=button.dataset.team;box.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===button));updateSubmit();}));
function updateSubmit(){const ready=choices.trial&&choices.convince;$('submit').disabled=!ready;$('submit').textContent=ready?'提交两题投票':'请选择两题后提交';}
function finish(){document.querySelectorAll('.question,.rules,.submit,.error,.lead').forEach(x=>x.style.display='none');$('done').classList.add('active');$('voted').textContent=`试岗价值：${label(choices.trial)} · 发布说服力：${label(choices.convince)}`;window.scrollTo({top:0,behavior:'smooth'});}
function restore(){try{const saved=JSON.parse(localStorage.getItem(LS_KEY));if(saved&&saved.trial&&saved.convince){choices.trial=saved.trial;choices.convince=saved.convince;finish();return true;}}catch(e){localStorage.removeItem(LS_KEY);}return false;}
async function submit(){if(!choices.trial||!choices.convince)return;if(localStorage.getItem(LS_KEY)){restore();return;}$('submit').disabled=true;$('submit').textContent='提交中…';$('error').textContent='';const key=`combo-${choices.trial.toLowerCase()}-${choices.convince.toLowerCase()}`;try{if(!PREVIEW){const r=await fetch(`${API}/hit/${NS}/${key}`,{method:'GET',cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);}else{await new Promise(r=>setTimeout(r,250));}localStorage.setItem(LS_KEY,JSON.stringify({...choices,ts:Date.now()}));finish();}catch(e){console.warn(e);$('error').textContent='提交失败，请检查网络后再试一次。';$('submit').disabled=false;$('submit').textContent='重新提交';}}
$('submit').addEventListener('click',submit);restore();
</script>
</body>
</html>
