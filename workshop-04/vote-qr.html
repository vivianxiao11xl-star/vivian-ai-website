<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0f">
<title>AI 员工发布会 · 扫码投票</title>
<style>
  :root{--bg:#080a0f;--fg:#f7f8fb;--muted:#8991a2;--gold:#d8ff3e}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(circle at 12% -5%,rgba(79,140,255,.22),transparent 34%),radial-gradient(circle at 88% 4%,rgba(216,255,62,.14),transparent 30%),var(--bg)}
  .stage{height:100vh;display:grid;grid-template-columns:1.08fr .92fr;gap:5vw;align-items:center;padding:6vh 7vw}.eyebrow{color:var(--gold);font-size:clamp(12px,1.1vw,17px);font-weight:900;letter-spacing:6px;margin-bottom:22px}.copy h1{font-size:clamp(58px,7vw,112px);line-height:.96;letter-spacing:-5px;margin:0;font-weight:950}.copy h1 span{color:var(--gold)}.sub{font-size:clamp(20px,2vw,32px);font-weight:800;line-height:1.5;color:#c6cbd5;margin-top:28px}.rule{margin-top:26px;color:var(--muted);font-size:clamp(14px,1.25vw,20px);line-height:1.8}.rule b{color:var(--fg)}
  .right{text-align:center}.qr{width:min(39vw,560px);margin:0 auto;background:#fff;border-radius:38px;padding:30px;box-shadow:0 42px 130px rgba(0,0,0,.5),0 0 100px rgba(216,255,62,.13)}.qr img{display:block;width:100%;height:auto}.url{margin-top:20px;font-size:clamp(15px,1.2vw,20px);font-weight:800;color:#c9ced8;letter-spacing:.2px}.hint{position:fixed;left:7vw;bottom:4vh;color:#555e70;font-size:12px;letter-spacing:1px}
  @media(max-width:900px){html,body{overflow:auto}.stage{height:auto;min-height:100vh;grid-template-columns:1fr;text-align:center;padding:5vh 6vw}.copy h1{font-size:58px;letter-spacing:-3px}.qr{width:min(76vw,460px)}.hint{display:none}}
</style>
</head>
<body>
<main class="stage">
  <section class="copy"><div class="eyebrow">DAY 1 NIGHT · LIVE VOTE</div><h1>扫码<br><span>投出你的一票</span></h1><div class="sub">哪一名 AI 员工<br>最值得明天上岗？</div><div class="rule"><b>每人 1 票 · 不能投自己组</b><br>参考：真实场景 · 3C 清楚 · 网站和视频 · 6 个月可落地</div></section>
  <section class="right"><a href="vote.html" aria-label="进入现场投票"><div class="qr"><img src="qrcode-vote.png" alt="扫码进入 AI 员工发布会现场投票"></div></a><div class="url">vivianai.cn/workshop-04/vote.html</div></section>
</main>
<div class="hint">投屏页 · 第四期一号位 AI 工作坊</div>
</body>
</html>
