<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080a0f">
<title>AI 员工发布会 · 现场投票</title>
<style>
  :root {
    --bg:#080a0f; --panel:#11151f; --panel-2:#171c28; --fg:#f7f8fb; --muted:#8c93a5;
    --gold:#d8ff3e; --line:rgba(255,255,255,.09); --danger:#ff7d8a;
    --a:#4f8cff; --a2:#2557d6; --b:#1fc78a; --b2:#087a58;
    --c:#ef5da8; --c2:#a82670; --d:#ff9f43; --d2:#d35d16;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(circle at 15% -5%,rgba(79,140,255,.18),transparent 32%),radial-gradient(circle at 90% 4%,rgba(216,255,62,.11),transparent 28%),var(--bg)}
  button{font:inherit}
  .wrap{width:min(100%,560px);min-height:100vh;margin:0 auto;padding:30px 20px 42px;display:flex;flex-direction:column}
  .eyebrow{color:var(--gold);font-size:11px;line-height:1.4;font-weight:900;letter-spacing:3.5px;text-transform:uppercase;margin-bottom:12px}
  h1{font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-1.2px;margin:0 0 12px;font-weight:950}
  .lead{margin:0 0 18px;color:#b7bdca;font-size:14px;line-height:1.7}
  .criteria{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 24px}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:999px;padding:7px 10px;color:#aeb5c4;font-size:11px;font-weight:750}
  .screen{display:none;flex-direction:column;flex:1}.screen.active{display:flex}
  .step{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px;color:var(--muted);font-size:11px;font-weight:900;letter-spacing:1.3px}
  .step b{color:var(--gold);font-weight:900}
  .list{display:flex;flex-direction:column;gap:11px}
  .team-btn{appearance:none;width:100%;display:grid;grid-template-columns:56px 1fr 22px;align-items:center;gap:13px;text-align:left;color:var(--fg);background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s,opacity .16s}
  .team-btn:active{transform:scale(.985)}.team-btn:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.065)}
  .team-btn.loading{opacity:.42;pointer-events:none}.team-btn .arrow{color:#666f82;font-size:22px;text-align:center}
  .badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:950;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .badge.A{background:linear-gradient(145deg,var(--a),var(--a2))}.badge.B{background:linear-gradient(145deg,var(--b),var(--b2))}.badge.C{background:linear-gradient(145deg,var(--c),var(--c2))}.badge.D{background:linear-gradient(145deg,var(--d),var(--d2))}
  .team-title{font-size:17px;line-height:1.25;font-weight:900}.team-title small{display:inline-block;margin-left:7px;color:var(--muted);font-size:10px;letter-spacing:1px;vertical-align:2px}
  .members{margin-top:6px;color:var(--muted);font-size:11px;line-height:1.5;font-weight:600}
  .rule-card{border:1px solid rgba(216,255,62,.18);background:rgba(216,255,62,.055);border-radius:16px;padding:13px 14px;margin:0 0 15px;color:#cfd4de;font-size:13px;line-height:1.65}.rule-card b{color:var(--gold)}
  .back{appearance:none;background:none;border:0;color:var(--muted);padding:17px 4px 4px;cursor:pointer;font-size:12px;text-align:center}.back:hover{color:var(--fg)}
  .err{min-height:20px;margin-top:12px;color:var(--danger);font-size:12px;text-align:center;line-height:1.5}
  .done{margin-top:22px;padding:44px 22px 36px;text-align:center;border:1px solid rgba(216,255,62,.22);border-radius:26px;background:linear-gradient(145deg,rgba(216,255,62,.11),rgba(216,255,62,.025))}
  .check{width:76px;height:76px;border-radius:50%;margin:0 auto 20px;display:grid;place-items:center;background:var(--gold);color:#111609;font-size:40px;font-weight:950;box-shadow:0 18px 55px rgba(216,255,62,.2)}
  .done h2{font-size:28px;margin:0 0 8px}.voted{font-size:15px;color:var(--gold);font-weight:850;line-height:1.55;margin-top:14px}.done p{color:var(--muted);font-size:12px;line-height:1.7;margin:18px 0 0}
  .footer{margin-top:auto;padding-top:28px;text-align:center;color:#626a7c;font-size:10px;letter-spacing:.7px}
  .noscript{margin:20px;padding:14px;border:1px solid var(--danger);color:var(--danger)}
  @media (max-width:380px){.wrap{padding-left:15px;padding-right:15px}.team-btn{grid-template-columns:50px 1fr 16px;padding:12px}.badge{width:50px;height:50px}.members{font-size:10px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<noscript><div class="noscript">请开启浏览器 JavaScript 后参与投票。</div></noscript>
<main class="wrap">
  <div class="eyebrow">DAY 1 NIGHT · COHORT 04</div>
  <h1>哪一名 AI 员工<br>最值得明天上岗？</h1>
  <p class="lead">不是选最好看的，而是选你最愿意带回公司试岗、且未来 6 个月最可能真实落地的一组。</p>
  <div class="criteria" aria-label="投票参考标准">
    <span class="chip">真实场景</span><span class="chip">3C 清楚</span><span class="chip">网站 + 视频</span><span class="chip">6 个月可落地</span>
  </div>

  <section class="screen active" id="screen-self" aria-labelledby="self-step">
    <div class="step" id="self-step"><span>STEP 1 / 2</span><b>先选择你所在的小组</b></div>
    <div class="list" id="self-list"></div>
  </section>

  <section class="screen" id="screen-vote" aria-labelledby="vote-step">
    <div class="rule-card">你来自 <b id="self-label">—</b><br>每人 1 票，不能投自己组；从其他三组中选择你最想让它上岗的一组。</div>
    <div class="step" id="vote-step"><span>STEP 2 / 2</span><b>投出你的一票</b></div>
    <div class="list" id="vote-list"></div>
    <div class="err" id="err" role="alert"></div>
    <button class="back" type="button" onclick="resetSelf()">← 选错自己的组？返回重选</button>
  </section>

  <section class="screen" id="screen-done" aria-live="polite">
    <div class="done">
      <div class="check">✓</div>
      <h2>投票成功</h2>
      <div class="voted" id="voted-label">—</div>
      <p>本设备已完成投票，不能重复提交。<br>请等待 Vivian 现场亮票。</p>
    </div>
  </section>

  <div class="footer">一号位 AI 工作坊 · 一小时 AI 员工发布会</div>
</main>
<script>
  const API = 'https://abacus.jasoncameron.dev';
  const NS = 'vivian-ws-0822-day1-ai-employee-vote-v1';
  const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
  const LS_KEY = 'vivian_ws_0822_ai_employee_vote_v1' + (PREVIEW ? '_preview' : '');
  const TEAMS = ['A','B','C','D'];
  const META = {
    A:{title:'财务场景',members:'钱殷 · 陈绢花 · 张仕乔 · 刘鋆睿 · 贺小波'},
    B:{title:'管理 / 项目管理',members:'Steven · 严志刚 · 孙越 · 艾文科'},
    C:{title:'内容场景',members:'李晔 · 赵浵希 · 柴玮 · 王羽若 · 任丁'},
    D:{title:'销售场景',members:'Lily · 钟舒乔 · 汪丽娜 · 庄珂嘉 · Ava'}
  };
  const $ = id => document.getElementById(id);
  let self = null;

  function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
  function teamCard(t,action){
    const button=document.createElement('button');
    button.type='button';button.className='team-btn';button.dataset.team=t;
    button.setAttribute('aria-label',`${t} 组，${META[t].title}`);
    button.innerHTML=`<span class="badge ${t}">${t}</span><span><span class="team-title">${META[t].title}<small>${t} 组</small></span><span class="members">${META[t].members}</span></span><span class="arrow">›</span>`;
    button.addEventListener('click',action);return button;
  }
  function renderSelf(){const box=$('self-list');box.innerHTML='';TEAMS.forEach(t=>box.appendChild(teamCard(t,()=>pickSelf(t))));}
  function pickSelf(t){self=t;$('self-label').textContent=`${t} 组 · ${META[t].title}`;const box=$('vote-list');box.innerHTML='';TEAMS.filter(x=>x!==t).forEach(x=>box.appendChild(teamCard(x,()=>submitVote(x))));$('err').textContent='';show('screen-vote');window.scrollTo({top:0,behavior:'smooth'});}
  function resetSelf(){self=null;$('err').textContent='';show('screen-self');window.scrollTo({top:0,behavior:'smooth'});}
  function finish(team){$('voted-label').textContent=`你投给了 ${team} 组 · ${META[team].title}`;show('screen-done');window.scrollTo({top:0,behavior:'smooth'});}
  async function submitVote(team){
    if(!self||team===self)return;
    if(localStorage.getItem(LS_KEY)){restoreVote();return;}
    $('err').textContent='';document.querySelectorAll('#vote-list .team-btn').forEach(b=>b.classList.add('loading'));
    try{
      let count=0;
      if(PREVIEW){await new Promise(r=>setTimeout(r,260));count=1;}
      else{
        const response=await fetch(`${API}/hit/${NS}/team-${team.toLowerCase()}`,{method:'GET',cache:'no-store'});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const data=await response.json();count=data.value||0;
      }
      localStorage.setItem(LS_KEY,JSON.stringify({self,voted:team,ts:Date.now(),count}));finish(team);
    }catch(error){console.warn(error);$('err').textContent='提交失败，请检查网络后再试一次';document.querySelectorAll('#vote-list .team-btn').forEach(b=>b.classList.remove('loading'));}
  }
  function restoreVote(){
    try{const saved=JSON.parse(localStorage.getItem(LS_KEY));if(saved&&META[saved.voted]){finish(saved.voted);return true;}}
    catch(error){localStorage.removeItem(LS_KEY);}return false;
  }
  renderSelf();restoreVote();
</script>
</body>
</html>
