<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0f">
<title>AI 员工发布会 · 现场亮票</title>
<style>
  :root{--bg:#080a0f;--fg:#f7f8fb;--muted:#7e879a;--gold:#d8ff3e;--a:#4f8cff;--a2:#2557d6;--b:#1fc78a;--b2:#087a58;--c:#ef5da8;--c2:#a82670;--d:#ff9f43;--d2:#d35d16}
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(circle at 14% -10%,rgba(79,140,255,.18),transparent 32%),radial-gradient(circle at 88% 0,rgba(216,255,62,.11),transparent 29%),var(--bg)}
  .stage{height:100vh;display:flex;flex-direction:column;padding:4.2vh 4.5vw 3vh}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:2vh}.eyebrow{color:var(--gold);font-size:clamp(11px,1vw,15px);font-weight:900;letter-spacing:5px}.head h1{font-size:clamp(34px,4vw,66px);line-height:1.04;letter-spacing:-2px;margin:8px 0 0;font-weight:950}.meta{text-align:right;color:var(--muted);font-size:14px}.total{font-size:clamp(34px,4vw,62px);line-height:1;font-weight:950;color:var(--gold);margin-top:4px}.status{margin-top:8px;font-size:11px}.status.ok{color:#76dda9}.status.bad{color:#ff7d8a}
  .bars{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:2.3vw;align-items:end;padding:0 .5vw 2vh}.col{height:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.bar-wrap{flex:1;width:min(100%,180px);min-height:90px;display:flex;align-items:flex-end}.bar{width:100%;min-height:12px;border-radius:22px 22px 5px 5px;transition:height 1s cubic-bezier(.22,1,.36,1),filter .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}.bar.A,.badge.A{background:linear-gradient(180deg,var(--a),var(--a2))}.bar.B,.badge.B{background:linear-gradient(180deg,var(--b),var(--b2))}.bar.C,.badge.C{background:linear-gradient(180deg,var(--c),var(--c2))}.bar.D,.badge.D{background:linear-gradient(180deg,var(--d),var(--d2))}.col.leader .bar{filter:brightness(1.15);box-shadow:0 0 60px rgba(216,255,62,.35),inset 0 1px 0 rgba(255,255,255,.3)}
  .count{font-size:clamp(42px,4.6vw,78px);line-height:1;font-weight:950;letter-spacing:-2px;margin:1.2vh 0 .8vh}.col.leader .count,.col.leader .title{color:var(--gold)}.percent{color:var(--muted);font-size:12px;font-weight:750;margin-bottom:1.2vh}.crown{height:30px;font-size:28px;opacity:0;transition:opacity .3s}.col.leader .crown{opacity:1}.badge{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;color:#fff;font-size:28px;font-weight:950;margin-bottom:8px}.label{font-size:15px;color:var(--muted);font-weight:850;letter-spacing:1.5px}.title{font-size:clamp(15px,1.35vw,22px);font-weight:900;text-align:center;line-height:1.25;margin-top:5px;min-height:2.5em;display:flex;align-items:flex-start;justify-content:center}
  .foot{display:flex;justify-content:center;align-items:center;gap:12px;color:var(--muted);font-size:12px}.btn{appearance:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:var(--fg);border-radius:999px;padding:9px 17px;font-size:12px;font-weight:850;cursor:pointer}.btn.primary{background:var(--gold);color:#111609;border-color:var(--gold)}.btn:hover{transform:translateY(-1px)}
  body.hidden-results .bar,body.hidden-results .count,body.hidden-results .percent{visibility:hidden}body.hidden-results .bar-wrap:after{content:"等待亮票";width:100%;align-self:flex-end;text-align:center;padding:32px 0;color:#545d70;font-size:13px;font-weight:850;letter-spacing:2px;border:1px dashed rgba(255,255,255,.1);border-radius:18px}.hidden-results .crown{opacity:0!important}
  @media(max-width:900px){.stage{padding:3vh 3vw}.head h1{font-size:30px}.bars{gap:1.4vw}.bar-wrap{width:80px}.badge{width:46px;height:46px;font-size:22px}.title{font-size:12px}.count{font-size:38px}.label{font-size:11px}}
</style>
</head>
<body class="hidden-results">
<main class="stage">
  <header class="head">
    <div><div class="eyebrow">DAY 1 NIGHT · LIVE RESULT</div><h1>哪一名 AI 员工<br>最值得明天上岗？</h1></div>
    <div class="meta">已投票<div class="total" id="total">0</div><div class="status" id="status">正在连接…</div></div>
  </header>
  <section class="bars" id="bars"></section>
  <footer class="foot"><span>每 1.5 秒自动刷新</span><button class="btn primary" id="reveal" type="button">亮票</button><button class="btn" id="fullscreen" type="button">全屏</button></footer>
</main>
<script>
  const API='https://abacus.jasoncameron.dev';
  const NS='vivian-ws-0822-day1-ai-employee-vote-v1';
  const TEAMS=['A','B','C','D'];
  const META={A:'财务场景',B:'管理 / 项目管理',C:'内容场景',D:'销售场景'};
  const counts=Object.fromEntries(TEAMS.map(t=>[t,0]));
  let revealed=false;
  const $=id=>document.getElementById(id);

  function build(){const box=$('bars');box.innerHTML='';TEAMS.forEach(t=>{const col=document.createElement('article');col.className='col';col.dataset.team=t;col.innerHTML=`<div class="bar-wrap"><div class="bar ${t}" style="height:12px"></div></div><div class="count" id="count-${t}">0</div><div class="percent" id="pct-${t}">0%</div><div class="crown">👑</div><div class="badge ${t}">${t}</div><div class="label">${t} 组</div><div class="title">${META[t]}</div>`;box.appendChild(col);});}
  async function getCount(t){try{const r=await fetch(`${API}/get/${NS}/team-${t.toLowerCase()}?t=${Date.now()}`,{cache:'no-store'});if(r.status===404)return 0;if(!r.ok)throw new Error(String(r.status));const d=await r.json();return Number(d.value)||0;}catch(e){throw e;}}
  async function fetchAll(){try{const values=await Promise.all(TEAMS.map(getCount));values.forEach((v,i)=>counts[TEAMS[i]]=v);$('status').textContent='实时连接正常';$('status').className='status ok';render();}catch(error){console.warn(error);$('status').textContent='网络连接异常，正在重试';$('status').className='status bad';}}
  function render(){const total=TEAMS.reduce((s,t)=>s+counts[t],0);$('total').textContent=total;const max=Math.max(...TEAMS.map(t=>counts[t]),1);const leaders=total?TEAMS.filter(t=>counts[t]===max):[];TEAMS.forEach(t=>{const col=document.querySelector(`.col[data-team="${t}"]`);col.querySelector('.bar').style.height=Math.max(4,(counts[t]/max)*100)+'%';$(`count-${t}`).textContent=counts[t];$(`pct-${t}`).textContent=total?Math.round(counts[t]/total*100)+'%':'0%';col.classList.toggle('leader',revealed&&counts[t]>0&&leaders.includes(t));});}
  function toggleReveal(){revealed=!revealed;document.body.classList.toggle('hidden-results',!revealed);$('reveal').textContent=revealed?'隐藏票数':'亮票';$('reveal').classList.toggle('primary',!revealed);render();}
  function fullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
  build();$('reveal').addEventListener('click',toggleReveal);$('fullscreen').addEventListener('click',fullscreen);document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggleReveal();}if(e.key.toLowerCase()==='f')fullscreen();});fetchAll();setInterval(fetchAll,1500);
</script>
</body>
</html>
