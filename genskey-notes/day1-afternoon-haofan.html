<meta charset="utf-8">
<title>一号位 AI 工作坊</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Public, same-origin assets can arrive while the reader enters the password.
  // This does not fetch or expose any plaintext learning content.
  (() => {
    const files = [["brand.css", "style"], ["framework.js", "script"],
      ["assets/vivian-logo.png", "image"], ["assets/genskey-logo.png", "image"]];
    const page = location.pathname.split("/").pop();
    if (page.startsWith("day")) files.push(["cohort-note.css", "style"],
      ["cohort-common.css", "style"], ["cohort-notes-adapter.css", "style"],
      ["cohort-notes.js", "script"]);
    if (page === "toolkit.html") files.push(["framework.css", "style"]);
    files.forEach(([href, as]) => {
      const link = document.createElement("link");
      link.rel = "preload"; link.href = href; link.as = as;
      document.head.appendChild(link);
    });
  })();
</script>

        link.fetchPriority = "low"; document.head.appendChild(link);
      });
      // Shared note styles are small and make the first article switch faster.
      ["cohort-note.css", "cohort-common.css", "cohort-notes-adapter.css",
       "cohort-notes.js", "framework.css"].forEach(file => {
        const link = document.createElement("link");
        link.rel = "prefetch"; link.as = file.endsWith(".css") ? "style" : "script";
        link.href = file; link.fetchPriority = "low"; document.head.appendChild(link);
      });
    };
    setTimeout(() => {
      if ("requestIdleCallback" in window) requestIdleCallback(warm, { timeout: 2000 });
      else warm();
    }, 600);
  }

  // Keep network fonts and unrelated load events off the unlock critical path.
  document.addEventListener("DOMContentLoaded", async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad().catch(() => ({ isSuccessful: false }));
    if (isSuccessful) warmApprovedPages();
    if (!isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");

      if (isRememberEnabled) {
