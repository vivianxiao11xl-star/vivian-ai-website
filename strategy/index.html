<!DOCTYPE html>

<title>创始人战略自问｜你的战略，一页纸说清楚</title>
<style>
:root{--bg:#f7f5f0;--ink:#1f2328;--sub:#5f646b;--line:#e2ddd0;--blue:#1d4f91;--blue-bg:#e8f0fb;--brown:#7a4a12;--brown-bg:#f8eedd;--gold:#9a6b00;--red:#c62828}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.app{max-width:860px;margin:0 auto;padding:28px 22px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:18px}
.brand small{font-weight:400;color:var(--sub);margin-left:6px;font-size:13px}
.link{background:none;border:none;color:var(--blue);font-size:14px;padding:4px 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
h1{font-size:30px;margin:0 0 10px;line-height:1.35}
.lead{color:var(--sub);margin:0 0 18px}
.quote{font-size:19px;font-weight:600;color:var(--brown);line-height:1.6;border-left:4px solid var(--brown);padding:2px 0 2px 14px;margin:0 0 8px}
.quote.q2{margin-bottom:22px}
.gets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 18px}
.gets div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfbf8}
.gets b{display:block;font-size:16px}
.gets span{font-size:13.5px;color:var(--sub)}
.btn.big{font-size:17px;padding:14px 28px}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 22px}
.steps4 div{background:var(--blue-bg);border-radius:12px;padding:12px;text-align:center}
.steps4 b{display:block;color:var(--blue);font-size:17px}
.steps4 span{font-size:13px;color:var(--sub)}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input.t{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfbf8}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:600}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{display:flex;gap:6px;margin-bottom:14px}
.progress .seg{flex:1}
.progress .seg .name{font-size:12.5px;color:var(--sub);text-align:center;margin-bottom:4px}
.progress .seg.on .name{color:var(--blue);font-weight:700}
.bar{height:6px;background:#e9e5da;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.qmeta{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.5px;margin-bottom:6px}
.q{font-size:25px;font-weight:700;line-height:1.45;margin:0 0 10px}
.why{color:var(--sub);margin:0 0 14px;font-size:15px}
details{background:#fff8e6;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14.5px}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
details ul{margin:6px 0 2px;padding-left:20px}
.ex{color:#6b5d3e;margin-top:6px}
.ta-wrap{position:relative}
textarea{width:100%;min-height:190px;font:inherit;font-size:17px;line-height:1.7;padding:14px 16px 52px;border:1.5px solid var(--line);border-radius:14px;background:#fcfbf8;resize:vertical}
textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.interim{position:absolute;left:16px;right:120px;bottom:14px;color:#9aa0a6;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{position:absolute;right:12px;bottom:12px;border:none;border-radius:22px;padding:8px 16px;background:var(--blue);color:#fff;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}70%{box-shadow:0 0 0 12px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}
.tip{font-size:13px;color:var(--sub);margin-top:8px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.saved{font-size:12.5px;color:#8a9;}

<script>
/* ================= 问题库（按课程主线） ================= */
const SECTIONS = [
 {key:"b", name:"定边界", ask:"我在哪？该去哪？"},
 {key:"n", name:"定需求", ask:"为谁创造什么价值？有人真买单吗？"},
 {key:"a", name:"定优势", ask:"凭什么是我？靠什么撑得住？"},
 {key:"z", name:"定战役", ask:"打哪一点？怎么打赢？"}
];
const Q = [
 // 定边界
 {id:"b1",s:"b",short:"业务是什么",q:"你的业务是什么？你把自己的什么优势，送到了谁的什么没被满足的需求上？",
  why:"老师的定义：业务，就是把我的优势送到未满足的需求上去。业务没想清楚，就别急着谈公司战略。",
  hints:["先别说产品名，说你在帮谁解决什么","你的优势是什么？别人为什么找你，不找别人？"],
  ex:"一家做家庭清洁用品的工厂：把多年代工练出来的品质，送到“做家务的人希望被看见”的需求上。"},
 {id:"b2",s:"b",short:"有几条业务线",q:"你手上有几条业务线？它们是同一批人在买、同一条路找来、同一帮人交付的吗？",
  why:"三件事里有两件不一样，就该当两门生意分别想；混在一起，后面每一步都会乱。",
  hints:["把所有在收钱的产品或服务都列出来","每条线：谁买？怎么找到他？谁来交付？"],
  ex:"同一批老板、同一个团队，只是价格和深度不同，可以算一门生意的几个产品。"},
 {id:"b3",s:"b",short:"使命与边界",q:"用一句话说：我们是谁、为什么而奋斗？哪些事即使赚钱，我们也不做？",
  why:"使命管十年，主航道管业务边界。使命和主航道首先规定的是“不做什么”。",
  hints:["多数高管当场说不出使命，这本身就是答案","想想过去拒绝过的生意，为什么拒绝"],
  ex:"阿里早期做过很多后来证明不对的尝试，但“让天下没有难做的生意”一直没变。"},
 {id:"b4",s:"b",short:"阶段与破局",q:"每条业务现在走到哪一段了？“来”“钱”“快”各有什么证据？",
  why:"来＝有人主动来、真在用；钱＝愿意付钱、过得了毛利线；快＝不靠老关系也能持续来、交付得了。顺序不能倒：来钱快，不是快来钱。",
  hints:["H3 探索期：还在验证能不能成","H2 增长期：在比速度和份额","H1 成熟期：在比利润和能不能久"],

/* ================= 状态 ================= */
const KEY="sidingziwen_v1";
let st = JSON.parse(localStorage.getItem(KEY)||"null") || {name:"",company:"",answers:{},cur:-1,view:"home"};
const save=()=>{localStorage.setItem(KEY,JSON.stringify(st));const s=document.getElementById("saved");if(s){s.textContent="已自动保存 "+new Date().toLocaleTimeString().slice(0,5)}};
const $=s=>document.querySelector(s);
const esc=t=>(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)};
const done=()=>Q.filter(q=>(st.answers[q.id]||"").trim()).length;

/* ================= 语音 ================= */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
function toggleMic(){
  const ta=$("#ta"); if(!ta) return;
  if(!SR){toast("这个浏览器不支持网页语音，请用输入法的语音键");return}
  if(listening){rec&&rec.stop();return}
  rec=new SR(); rec.lang="zh-CN"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){
        const txt=r[0].transcript;
        const p=ta.selectionStart??ta.value.length;
        ta.value=ta.value.slice(0,p)+txt+ta.value.slice(p);
        ta.selectionStart=ta.selectionEnd=p+txt.length;
        st.answers[Q[st.cur].id]=ta.value; save();
      } else interim+=r[0].transcript;
    }
    $("#interim").textContent=interim;
  };
  rec.onstart=()=>{listening=true;updMic()};
  rec.onend=()=>{listening=false;updMic();const i=$("#interim");if(i)i.textContent=""};
  rec.onerror=e=>{listening=false;updMic();toast(e.error==="not-allowed"?"请允许浏览器使用麦克风":"语音暂时不可用："+e.error)};
  rec.start();
}
function updMic(){const m=$("#mic");if(!m)return;m.classList.toggle("on",listening);m.innerHTML=listening?"■ 停止说话":"🎙 按一下说话"}
function stopMic(){if(listening&&rec)rec.stop()}

/* ================= 页面 ================= */
function render(){
  stopMic();
  const app=$("#app");
  const top=`<div class="top noprint"><div class="brand">创始人战略自问<small>你的战略，一页纸说清楚</small></div>
   <div>${st.view!=="home"?`<a class="link" href="map.html" target="_blank" style="text-decoration:none">学习图</a><button class="link" onclick="go('overview')">全部问题</button><button class="link" onclick="go('page')">看一页纸</button>`:""}</div></div>`;
  app.classList.toggle("home",st.view==="home");
  if(st.view==="home") app.innerHTML=home();
  else if(st.view==="q") app.innerHTML=top+question();
  else if(st.view==="overview") app.innerHTML=top+overview();
  else app.innerHTML=top+onePage();
  if(st.view==="q"){const ta=$("#ta");ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length}
}
function go(v,i){if(i!==undefined)st.cur=i; st.view=v; save(); render(); window.scrollTo(0,0)}

function start(){st.name=$("#nm").value.trim();st.company=$("#co").value.trim();go("q",st.cur>=0?st.cur:0)}
function resetAll(){if(confirm("确定清空所有回答吗？")){st={name:"",company:"",answers:{},cur:-1,view:"home"};save();render()}}

function progress(){
  return `<div class="progress">${SECTIONS.map(s=>{
    const qs=Q.filter(q=>q.s===s.key), d=qs.filter(q=>(st.answers[q.id]||"").trim()).length;
    const on=Q[st.cur].s===s.key;
    return `<div class="seg ${on?"on":""}"><div class="name">${s.name} ${d}/${qs.length}</div><div class="bar"><i style="width:${d/qs.length*100}%"></i></div></div>`}).join("")}</div>`;
}
function question(){
  const q=Q[st.cur], sec=SECTIONS.find(s=>s.key===q.s);
  const idx=Q.filter(x=>x.s===q.s).indexOf(q)+1, tot=Q.filter(x=>x.s===q.s).length;
  return `${progress()}<div class="card">
   <div class="qmeta">${sec.name} · 第 ${idx}/${tot} 问 · ${q.short}</div>
   <div class="q">${q.q}</div>
   <p class="why">${q.why}</p>
   <details><summary>想不出来？可以这样想</summary><ul>${q.hints.map(h=>`<li>${h}</li>`).join("")}</ul><div class="ex">例子：${q.ex}</div></details>
   <div class="ta-wrap">
     <textarea id="ta" placeholder="直接写，或者点右下角按钮用语音说。说得乱没关系，先说出来。" oninput="st.answers['${q.id}']=this.value;save()">${esc(st.answers[q.id]||"")}</textarea>
     <div class="interim" id="interim"></div>
     <button class="mic" id="mic" onclick="toggleMic()">🎙 按一下说话</button>
   </div>
   <div class="nav">

function prev(){if(st.cur>0)go("q",st.cur-1)}
function next(){if(st.cur<Q.length-1)go("q",st.cur+1);else go("page")}

  ${SECTIONS.map(s=>`<h3>${s.name}｜${s.ask}</h3>${Q.filter(q=>q.s===s.key).map(q=>{const i=Q.indexOf(q),ok=(st.answers[q.id]||"").trim();
   return `<div class="it" onclick="go('q',${i})"><span class="dot ${ok?"ok":""}"></span><span class="lbl"><b>${q.short}</b>　${q.q}</span></div>`}).join("")}`).join("")}
  <div class="row" style="margin-top:18px"><button class="btn primary" onclick="go('page')">看一页纸</button></div></div>`;
}

/* ================= 一页纸 ================= */
const A=id=>(st.answers[id]||"").trim();
const firstLine=t=>{t=t.replace(/\s+/g," ").trim();const m=t.match(/^.{1,90}?[。！？!?；;]/);return m?m[0]:(t.length>90?t.slice(0,90)+"…":t)};
function onePage(){
  const blk=s=>`<div class="blk"><h4>${s.name}｜${s.ask}</h4>${Q.filter(q=>q.s===s.key).map(q=>`<div class="kv"><b>${q.short}：</b>${A(q.id)?esc(A(q.id)):'<span class="empty">（还没想好）</span>'}</div>`).join("")}</div>`;
  const story=[
   ["我们是谁",A("b1")],["为什么是现在",A("b5")],["我们要去哪",A("b7")],
   ["我们看到的不一样",A("n6")],["凭什么是我们",A("a2")||A("a1")],["靠什么撑得住",A("a3")||A("a4")],
   ["所有事都是一件事",A("z2")],["接下来打哪几仗",A("z5")]
  ];
  const gaps=Q.filter(q=>!A(q.id)).map(q=>q.short);
  const one=A("b1")?firstLine(A("b1")):"（先回答“业务是什么”）";
  const dot=A("z2")?firstLine(A("z2")):"（先回答“真单点”）";
  return `<div class="page">
   <h2>${esc(st.company)||"我的公司"}的战略一页纸</h2>
   <div class="who">${esc(st.name)} · ${new Date().toLocaleDateString("zh-CN")}</div>
   <div class="one"><b>一句话：</b>${esc(one)}<br><b>这一阶段只打一个点：</b>${esc(dot)}</div>
   <div class="g4">${SECTIONS.map(blk).join("")}</div>
   <div class="story"><h4>讲给别人听：大故事 ＝ 远见＋雄心＋洞见＋理念＋实力＋单点＋战役</h4>
     <ol>${story.map(([k,v])=>`<li><b>${k}：</b>${v?esc(firstLine(v)):'<span style="color:#bbb">（待补）</span>'}</li>`).join("")}</ol></div>
   ${gaps.length?`<div class="gaps">还没想好的 ${gaps.length} 项：${gaps.join("、")}</div>`:""}
   <div class="foot">这是你的初稿，是待验证的假设，不是定论。每一条都可以问自己：什么证据出现，会说明我想错了？</div>
  </div>
  <div class="row noprint" style="margin-top:16px">
   <button class="btn primary" onclick="window.print()">打印 / 存成 PDF</button>
   <button class="btn ghost" onclick="copyMd()">复制为文字</button>
   <button class="btn ghost" onclick="dlMd()">下载 Markdown</button>
   <button class="btn ghost" onclick="go('overview')">回去修改</button>
  </div>`;
}
function md(){
  let s=`# ${st.company||"我的业务"}｜战略一页纸\n\n${st.name} · ${new Date().toLocaleDateString("zh-CN")}\n\n`;
  SECTIONS.forEach(x=>{s+=`## ${x.name}｜${x.ask}\n\n`;Q.filter(q=>q.s===x.key).forEach(q=>{s+=`**${q.short}**：${A(q.id)||"（还没想好）"}\n\n`})});
  return s;
}
function copyMd(){navigator.clipboard.writeText(md()).then(()=>toast("已复制"),()=>toast("复制失败，请用下载"))}
function dlMd(){const b=new Blob([md()],{type:"text/markdown"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(st.company||"战略")+"-一页纸.md";a.click()}

document.addEventListener("keydown",e=>{if(st.view==="q"&&(e.metaKey||e.ctrlKey)&&e.key==="Enter"){next()}});
render();
</script>
</body>
</html>
